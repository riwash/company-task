[project]
name = "patient-management-api"
version = "1.0.0"
description = "Flask API for a patient management dashboard"
authors = [{ name = "Patient Management Team" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "Flask>=3.1,<4.0",
    "Flask-Cors>=5.0,<6.0",
    "Flask-RESTX>=1.3,<2.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "gunicorn>=23.0,<24.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
